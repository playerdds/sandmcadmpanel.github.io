<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Administratora</title>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.1/bundles/skinview3d.bundle.js"></script>
<style>
:root{color-scheme:only light;--ink:#1b1708;--mut:#8c845f;--line:#e8dda8;--gold:#d9a400;--paper:#fffefa;--field:#fff;--hov:#fff8d6;--bar:#fffbe6;--top:#ffffffb0;
--stage:linear-gradient(180deg,#fff6cc,#fffefa);--tag:#fff1b0;--tagink:#7a5a00;--tagline:#f0d36a;--code:#fffbe6;--sh:#8a6a00;
--bg:linear-gradient(160deg,#fff 0%,#fffbe9 50%,#fff1b8 100%)}
:root[data-theme=dark]{color-scheme:dark;--ink:#f3f0e6;--mut:#9d9a8c;--line:#38362d;--gold:#f0bd1a;--paper:#1b1b1f;--field:#25252a;--hov:#2b2917;--bar:#212125;--top:#111113cc;
--stage:radial-gradient(circle at 50% 40%,#4a3d0e 0,#1b1b1f 70%);--tag:#3a3110;--tagink:#ffd84d;--tagline:#7d6410;--code:#222227;--sh:#000;
--bg:radial-gradient(1000px 600px at 100% 100%,#7a5f0a 0,transparent 65%),radial-gradient(700px 400px at 0% 0%,#2a2a30 0,transparent 70%),linear-gradient(160deg,#101012,#1c1c20)}
html{background:#fffbe9}:root[data-theme=dark]{background:#101012}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg) fixed}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px color-mix(in srgb,var(--sh) 8%,transparent),0 12px 32px -12px color-mix(in srgb,var(--sh) 19%,transparent)}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;margin:0}
label{display:flex;gap:8px;margin-bottom:10px}
input,textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);transition:border .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:#d1a000;box-shadow:0 0 0 3px #d9a40040}
textarea{min-height:120px;resize:vertical;line-height:1.5}
button{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--ink);border-radius:4px;padding:12px 22px;cursor:pointer;background:linear-gradient(180deg,#f7c828,#e3ab00);color:#2a2000;border-color:#d1a000;transition:.15s}
button:hover{background:linear-gradient(180deg,#ffd24d,#eab70c);border-color:#d1a000;color:#2a2000}
button.ghost{background:var(--field);color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:#d1a000;background:var(--hov);color:var(--ink)}
button:disabled{opacity:.5}
.err{min-height:1.3em;margin-top:14px;font-size:.88rem;color:#b3261e}.ok{color:#2a7d3b}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
/* login */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(760px,100%)}
.mark{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login .grid2{display:grid;grid-template-columns:1fr 1fr}
.login .cell{padding:26px}.login .cell+.cell{border-left:1px solid var(--line)}
@media(max-width:620px){.login .grid2{grid-template-columns:1fr}.login .cell+.cell{border-left:0;border-top:1px solid var(--line)}}
.login .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 26px;border-top:1px solid var(--line);background:var(--bar)}
/* app */
.top{border-bottom:1px solid var(--line);background:var(--top)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:14px}
.chip{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:6px 18px 6px 8px;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--sh) 19%,transparent)}
.chip .av{cursor:pointer;background-size:cover;background-position:center;transition:box-shadow .15s;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffe066,#d9a400);display:grid;place-items:center;font-weight:800;font-size:.9rem;position:relative}
.chip .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#2fb344;border:2px solid var(--paper)}
.chip .av:hover{box-shadow:0 0 0 3px var(--tagline)}
.chip .tx{display:flex;flex-direction:column;line-height:1.15}
.chip .tx b{font-size:.92rem}
.chip .st{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2a7d3b}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--mut);letter-spacing:.02em}
@media(max-width:560px){.chip .tx .st{display:none}.brand small{display:none}}
.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:28px 0 56px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.profile{padding:0;overflow:hidden;align-self:start}
.stage{display:grid;place-items:center;padding:10px 0 0;background:var(--stage)}
.stage canvas{max-width:100%;touch-action:none}
.pinfo{padding:18px 22px 22px;border-top:1px solid var(--line)}
.nick{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;margin:6px 0 10px}
.role{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:var(--tag);color:var(--tagink);border:1px solid var(--tagline);padding:5px 10px;border-radius:3px}
.pinfo .row{display:flex;gap:8px;margin-top:16px}
.pinfo button{padding:9px 14px;font-size:.82rem}
.mods{padding:26px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
@media(max-width:700px){.list{grid-template-columns:1fr}}
.item{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.item .n{width:26px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;color:var(--gold)}
.item .nm{flex:1;font-weight:600}
.item .ar{opacity:0;transform:translateX(-6px);transition:.15s}
.item:hover{padding-left:12px;background:var(--hov)}.item:hover .ar{opacity:1;transform:none}
.item.empty{cursor:default;color:#c9bf8c}.item.empty .nm{font-weight:400}.item.empty:hover{padding-left:4px;background:none}
.test{padding:30px;max-width:760px;margin:28px auto 56px}
.q{margin:26px 0}.q p{margin:0 0 10px;font-weight:600}
.srv{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;padding:24px 28px;margin:0 0 56px}
.srv img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 12px color-mix(in srgb,var(--sh) 30%,transparent))}
.srv .nm{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.srv .st{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.05rem}
.pulse{width:14px;height:14px;border-radius:50%;background:#9a9a9a;position:relative;flex:none}
.pulse.on{background:#2fb344}.pulse.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:#2fb344;animation:ping 1.6s ease-out infinite}
.pulse.off{background:#d93025}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.srv .pl{margin-top:10px;font-size:1rem}.srv .pl b{font-size:1.25rem}
.bar2{height:8px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden;max-width:420px}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f7c828,#e3ab00);transition:width .6s}
@media(max-width:520px){.srv img{width:64px;height:64px}.srv{padding:18px}}
.tar h1{font-size:1.5rem;letter-spacing:-.02em;margin:34px 0 8px;padding-bottom:12px;border-bottom:1px solid var(--line)}.tar h1:first-child{margin-top:6px}
.tar p{margin:16px 0;line-height:1.6}
.tar p.row{margin:0;padding:14px 4px;border-bottom:1px dashed var(--line)}.tar code{background:var(--tag);color:var(--ink);padding:2px 7px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:.88em}
.cb{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--code);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:14px 16px;margin:12px 0}
.cb pre{margin:0;flex:1;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;line-height:1.55}
.cb button{padding:6px 12px;font-size:.75rem;flex:none}
#themeBtn{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:44px;height:44px;padding:0;border-radius:50%;font-size:1.2rem;line-height:1;z-index:50;box-shadow:0 6px 18px #0000002e}
.tar h3{margin:32px 0 6px;font-size:1.15rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tar ul{margin:0;padding:0 0 0 20px}.tar li{padding:10px 0 10px 4px;border-bottom:1px dashed var(--line)}.tar li::marker{color:var(--gold)}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:10px;margin:0;padding:12px 22px;min-width:110px;border:1px solid var(--line);border-radius:4px;background:var(--field);cursor:pointer;font-weight:600;transition:.15s}
.opts label:hover{border-color:var(--ink)}
.opts label:has(input:checked){background:var(--tag);color:var(--tagink);border-color:#d1a000}
.opts input{width:auto;margin:0;accent-color:var(--gold);padding:0}
</style>
</head>
<body>

<button id="themeBtn" title="Zmień motyw" aria-label="Zmień motyw">☾</button>

<div id="loginView" class="center">
  <div class="login">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 3l15 8.5v17L20 37 5 28.500v-17z" fill="#e3ab00"/><path d="M20 3l15 8.5L20 20 5 11.500z" fill="#ffe58a"/><path d="M20 20v17" stroke="#fffbe6" stroke-width="1.500"/></svg>
      <div><div class="mono">Strefa zarządzania</div><h1>Panel Administratora</h1></div>
    </div>
    <div class="panel">
      <div class="grid2">
        <div class="cell"><label class="mono"><span style="color:var(--gold)">01</span> Hasło administratora</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <div class="cell"><label class="mono"><span style="color:var(--gold)">02</span> Nick z Minecrafta</label><input id="nick" type="text" placeholder="np. famosek" maxlength="16" autocomplete="off"></div>
      </div>
      <div class="bar"><span class="err" id="loginErr" style="margin:0"></span><button id="loginBtn">Zaloguj się →</button></div>
    </div>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="top"><div class="wrap" style="height:72px">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 40 40"><path d="M20 3l15 8.5v17L20 37 5 28.500v-17z" fill="#e3ab00"/><path d="M20 3l15 8.5L20 20 5 11.500z" fill="#ffe58a"/></svg><div>Panel Administratora<small>Strefa zarządzania</small></div></div>
    <div class="who">
      <span class="mono" id="timer"></span>
      <div class="chip"><div class="av" id="chipAv" title="Kliknij, aby zmienić zdjęcie profilowe" role="button" tabindex="0"></div><input type="file" id="avFile" accept="image/*" class="hidden"><div class="tx"><span class="st">Zalogowano</span><b id="chipNick"></b></div></div>
      <button class="ghost" id="logoutBtn" style="padding:9px 18px">Wyloguj</button>
    </div>
  </div></div>

  <div class="wrap" id="homeView">
    <div class="layout">
      <div class="panel profile">
        <div class="stage"><canvas id="skinCanvas"></canvas></div>
        <div class="pinfo">
          <div class="mono">Zalogowano jako</div>
          <div class="nick" id="nickLabel"></div>
          <span class="role">Administrator</span>
          <div class="row"><button class="ghost" id="skinBtn">Wgraj własny skin</button></div>
          <input type="file" id="skinFile" accept="image/png" class="hidden">
          <div class="mono" id="skinNote" style="margin-top:12px;text-transform:none;letter-spacing:.02em"></div>
        </div>
      </div>
      <div class="panel mods">
        <div class="mhead"><h2>Testy i weryfikacje</h2><span class="mono" id="count"></span></div>
        <div class="list" id="tiles"></div>
      </div>
    </div>
    <div class="panel srv">
      <div>
        <div class="mono">Status serwera</div>
        <div class="nm"><h2 id="srvName" style="font-size:1.5rem;letter-spacing:.02em"></h2></div>
        <div class="st"><span class="pulse" id="srvDot"></span><span id="srvState">Sprawdzanie…</span></div>
        <div class="pl">Gracze online: <b id="srvPl">–/–</b></div>
        <div class="bar2"><i id="srvBar"></i></div>
      </div>

function builtinSkin(){
  const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");
  const r=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h);};
  const SK="#d9a37a",SK2="#c58b63",HAIR="#2f2113",HAIR2="#4a3420",JK="#23232b",JK2="#2e2e38",GOLD="#d9a400",PANT="#2d3a5c",PANT2="#38476e",SHOE="#121216";
  // głowa
  r(SK,0,0,32,16);r(HAIR,8,0,8,8);r(HAIR2,10,2,3,2);r(SK2,16,0,8,8);
  r(HAIR,0,8,8,4);r(HAIR,16,8,8,4);r(HAIR,24,8,8,8);r(HAIR2,26,10,3,2);r(HAIR,8,8,8,3);r(HAIR,8,11,1,1);r(HAIR,15,11,1,1);
  r(SK2,3,13,2,2);r(SK2,19,13,2,2);                        // uszy
  r("#fff",9,12,2,1);r("#fff",13,12,2,1);r("#2d3a8c",10,12,1,1);r("#2d3a8c",13,12,1,1);
  r(HAIR,9,11,2,1);r(HAIR,13,11,2,1);r(SK2,11,13,2,1);r("#a0584a",11,14,2,1);
  // korpus (kurtka)
  r(JK,16,16,24,16);r(JK2,20,16,8,4);r(GOLD,23,20,2,12);r(GOLD,22,20,4,1);r(GOLD,20,31,8,1);r(JK2,32,20,8,4);
  // ręce (prawa i lewa)
  [[40,16],[32,48]].forEach(([ax,ay])=>{
    r(JK,ax,ay,16,16);r(JK2,ax+4,ay,4,4);r(GOLD,ax,ay+10,16,1);r(SK,ax,ay+12,16,4);r(SK2,ax+8,ay+12,4,4);
  });
  // nogi
  [[0,16],[16,48]].forEach(([lx,ly])=>{
    r(PANT,lx,ly,16,16);r(PANT2,lx+4,ly,4,4);r(PANT2,lx+4,ly+4,4,8);r(SHOE,lx,ly+12,16,4);
  });
  return c;
}

    g.append(d);
  }

function inline(el,text){
  text.split(/(```[\s\S]*?```|`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(part=>{
    if(!part)return;let n;
    if(part.length>=6&&part.startsWith("```")&&part.endsWith("```")){n=document.createElement("code");n.textContent=part.slice(3,-3);}
    else if(part.length>=3&&part[0]==="`"&&part.endsWith("`")){n=document.createElement("code");n.textContent=part.slice(1,-1);}
    else if(part.length>=5&&part.startsWith("**")&&part.endsWith("**")){n=document.createElement("strong");n.textContent=part.slice(2,-2);}
    else n=document.createTextNode(part);
    el.append(n);
  });
}
function codeBlock(box,text){
  const d=document.createElement("div");d.className="cb";
  const pre=document.createElement("pre");pre.textContent=text;
  const b=document.createElement("button");b.className="ghost";b.textContent="Kopiuj";
  b.onclick=async()=>{try{await navigator.clipboard.writeText(text);b.textContent="Skopiowano";}catch(e){b.textContent="Zaznacz i skopiuj";}setTimeout(()=>b.textContent="Kopiuj",1600);};
  d.append(pre,b);box.append(d);
}
function buildDoc(key){
  const box=$("tariffBody");box.textContent="";$("tariffTitle").classList.add("hidden");
  const lines=CONFIG[key].split("\n");let ul=null;
  for(let i=0;i<lines.length;i++){
    const L=lines[i],T=L.trim();
    if(!T){continue;}
    if(T==="```"){ul=null;const buf=[];i++;while(i<lines.length&&lines[i].trim()!=="```"){buf.push(lines[i]);i++;}codeBlock(box,buf.join("\n"));continue;}
    if(T.startsWith("```")&&T.endsWith("```")&&T.length>6){ul=null;codeBlock(box,T.slice(3,-3));continue;}
    if(L.startsWith("## ")){ul=null;const h=document.createElement("h3");inline(h,L.slice(3));box.append(h);continue;}
    if(L.startsWith("# ")){ul=null;const h=document.createElement("h1");inline(h,L.slice(2));box.append(h);continue;}
    if(L.startsWith("- ")){if(!ul){ul=document.createElement("ul");box.append(ul);}const li=document.createElement("li");inline(li,L.slice(2));ul.append(li);continue;}
    ul=null;const p=document.createElement("p");if(/^(✅|❌|`)/.test(T))p.className="row";inline(p,L);box.append(p);
  }
}
